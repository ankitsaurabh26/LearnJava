# ============================================================
# APPLICATION CONFIGURATION
# Yahan pe saari app ki settings define hoti hain
# ============================================================

# Server port (default 8080 hi rehne dete hain)
server.port=8080

# Application name - logging mein dikhta hai
spring.application.name=ecommerce-demo

# ============================================================
# MYSQL DATABASE CONFIGURATION
# Apna MySQL username/password yahan update karo
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=WelcomeNagra@890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (HikariCP use hota hai by default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE SETTINGS
# ============================================================

# DDL auto: 'update' matlab table already hai toh update karo,
# nahi hai toh create karo. Production mein 'validate' use karo.
spring.jpa.hibernate.ddl-auto=update

# SQL queries console mein dikhne chahiye ya nahi (debug ke liye)
spring.jpa.show-sql=true

# SQL queries ko achhe se format karna (reading easy hoti hai)
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect - Hibernate ko batata hai kaunsa DB hai
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# LOGGING
# ============================================================
logging.level.com.demo.ecommerce=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
